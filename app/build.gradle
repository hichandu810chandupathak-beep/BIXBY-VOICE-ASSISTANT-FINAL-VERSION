plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.bixby.voiceassistant'
    compileSdk 36

    defaultConfig {
        applicationId 'com.bixby.voiceassistant'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName "1.0.3"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

kotlin {
    jvmToolchain(21)
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
}
