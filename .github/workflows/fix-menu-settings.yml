name: Fix Menu Settings UI

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fix-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix early-return UI wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/bixby/voiceassistant/MainActivity.kt')
          s = p.read_text()
          old = '''        if (!isSupportedDevice()) {\n            status.text = "Device not supported"; return\n        }\n        launchedByHotword = intent.getBooleanExtra("HOTWORD_TRIGGERED", false)'''
          new = '''        // Wire every visible UI control before capability/device checks.\n        // A model-string mismatch must never leave Menu/Settings dead.\n        setupUiActions()\n        startIdleAnimation()\n        if (!isSupportedDevice()) {\n            status.text = "Device not supported"; return\n        }\n        launchedByHotword = intent.getBooleanExtra("HOTWORD_TRIGGERED", false)'''
          if old not in s:
              print('No matching old block; leaving source unchanged.')
          else:
              s = s.replace(old, new, 1)
              # Remove the later duplicate calls if they exist in the original block.
              s = s.replace('''        setupUiActions()\n        startIdleAnimation()\n        if (ContextCompat.checkSelfPermission''', '''        if (ContextCompat.checkSelfPermission''', 1)
              p.write_text(s)
          PY

      - name: Commit fix if changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/bixby/voiceassistant/MainActivity.kt
          git commit -m "Fix non-responsive Menu and Settings controls"
          git push
