name: Fix Menu Settings UI

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fix-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix early-return UI wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/bixby/voiceassistant/MainActivity.kt')
          lines = p.read_text().splitlines()
          marker = '        if (!isSupportedDevice()) { status.text = "Device not supported"; return }'
          if marker not in lines:
              raise SystemExit('Target device-check line not found; source layout changed.')
          i = lines.index(marker)
          setup = [
              '        // Wire visible UI controls before capability/device checks.',
              '        // A model-string mismatch must never leave Menu/Settings dead.',
              '        setupUiActions()',
              '        startIdleAnimation()',
          ]
          if lines[i-4:i] != setup:
              lines[i:i] = setup
          # Remove the original later duplicate setup calls once, if present.
          for j in range(i + len(setup) + 1, len(lines) - 1):
              if lines[j] == '        setupUiActions()' and lines[j+1] == '        startIdleAnimation()':
                  del lines[j:j+2]
                  break
          p.write_text('\n'.join(lines) + '\n')
          PY

      - name: Commit fix if changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add app/src/main/java/com/bixby/voiceassistant/MainActivity.kt
          git commit -m "Fix non-responsive Menu and Settings controls"
          git push