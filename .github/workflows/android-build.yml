name: Android Build Verify

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Gemini secret is available
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then echo "Gemini API secret: configured"; else echo "Gemini API secret: missing"; fi
      - name: Clean build
        run: |
          chmod +x gradlew
          ./gradlew clean
      - name: Build debug APK
        run: |
          ./gradlew assembleDebug --stacktrace
      - name: Verify APK metadata
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          stat app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload fresh APK
        uses: actions/upload-artifact@v4
        with:
          name: bixby-voice-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Bixby Voice Latest APK"
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
